<html>
<head>
<title>Sum of N Numbers</title>
</head>
<body>
<div id="demo"></div>
<script>
let n = 100; // You can change 'n' to any number you want
let sum = 0;
for (let i = 1; i <= n; i++) {
sum += i; // Add i to the sum
}
document.getElementById("demo").innerHTML = "Sum of numbers is:"+sum;
</script>
</body>
</html>
