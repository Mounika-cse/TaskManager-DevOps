<html>
<head>
    <title>Armstrong Number Checker</title>
    <script>
        function checkArmstrong() {
            var num = prompt("Enter a number to check if it is an Armstrong number:");
            
            if (num === null || num === "" || isNaN(num)) {
                alert("Please enter a valid number.");
                return;
            }

            var originalNum = parseInt(num);
            var len = num.length;
            var sum = 0;

            for (var i = 0; i < len; i++) {
                sum += Math.pow(parseInt(num[i]), len);
            }

            if (sum === originalNum) {
                alert(originalNum + " is an Armstrong number.");
            } else {
                alert(originalNum + " is not an Armstrong number.");
            }
        }
    </script>
</head>
<body>
<h2>Check Armstrong Number</h2>
<button onclick="checkArmstrong()">Check</button>
</body>
</html>
