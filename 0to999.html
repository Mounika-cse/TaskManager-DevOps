<html>
<head>
<title>Number to Words</title>
</head>
<body>
<script>
function convertToWords() {
  const numberInput = prompt("Enter a number between 0 and 999:");

  if (numberInput === null || numberInput.trim() === "") {
    alert("No number entered.");
    return;
  }

  const number = parseInt(numberInput);

  if (isNaN(number) || number < 0 || number > 999) {
    alert("Invalid input. Please enter a number between 0 and 999.");
    return;
  }

  const units = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
  const teens = ["ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
  const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];

  function getWords(n) {
    if (n === 0) {
      return "zero";
    } else if (n < 10) {
      return units[n];
    } else if (n < 20) { 
      return teens[n - 10];
    } else if (n < 100) {
      const tenDigit = Math.floor(n / 10);
      const unitDigit = n % 10;
      return tens[tenDigit] + (unitDigit === 0 ? "" : "-" + units[unitDigit]);
    } else {
      const hundredDigit = Math.floor(n / 100);
      const remaining = n % 100;
      return units[hundredDigit] + " hundred" + (remaining === 0 ? "" : " and " + getWords(remaining));
    }
  }
  const words = getWords(number);
  alert("The number in words is: " + words);
}
convertToWords();
</script>
</body>
</html>
