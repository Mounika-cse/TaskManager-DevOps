<html>
<head>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script ></script>

</head>
<body class="bg-gray-100 p-6">
    <h1 class="text-3xl font-semibold text-center text-blue-700 mb-8">Book Details</h1>
    <div id="bookList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>
    <script>
        const bookDetails = [
            { title: "The Great Gatsby", price: 10.99, author: "F. Scott Fitzgerald" },
            { title: "To Kill a Mockingbird", price: 12.99, author: "Harper Lee" },
            { title: "1984", price: 11.99, author: "George Orwell" },
            { title: "Pride and Prejudice", price: 9.99, author: "Jane Austen" },
            { title: "The Catcher in the Rye", price: 13.99, author: "J.D. Salinger" },
            { title: "The Lord of the Rings", price: 14.99, author: "J.R.R. Tolkien" },
            { title: "The Hitchhiker's Guide to the Galaxy", price: 8.99, author: "Douglas Adams" },
             { title: "Jane Eyre", price: 10.49, author: "Charlotte Brontë" },
        ];

        const bookListDiv = document.getElementById("bookList");

        bookDetails.forEach(book => {
            const bookCard = document.createElement("div");
            bookCard.classList.add("bg-white", "rounded-lg", "shadow-md", "p-4", "flex", "flex-col", "justify-between", "transition-transform", "hover:scale-105");

            bookCard.innerHTML = `
                <h2 class="text-xl font-semibold text-gray-800 mb-2">${book.title}</h2>
                <p class="text-gray-600 mb-2">Price: <span class="text-blue-500 font-semibold">$${book.price.toFixed(2)}</span></p>
                <p class="text-gray-500">Author: <span class="font-italic">${book.author}</span></p>
            `;

            bookListDiv.appendChild(bookCard);
        });
    </script>
</body>
</html>
