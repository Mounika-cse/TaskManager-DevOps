<html>
<head>
<title>Simple Palindrome Checker</title>
<script>
function checkPalindrome(){
var num=parseInt(prompt("Enter a number:"));
if(isNaN(num)){alert("Invalid number.");return;}
var original=num;
var rev=0;
while(num>0){
rev=rev*10+num%10;
num=Math.floor(num/10);
}
if(rev==original){alert(original+" is a Palindrome number.");}
else{alert(original+" is not a Palindrome number.");}
}
window.onload=checkPalindrome;
</script>
</head>
<body>
</body>
</html>
