<html>
<head>
<title>Armstrong Number Checker</title>
</head>
<body>
<script>
function Armstrong() {
  var num = prompt("Enter a number:");
  var originalNum = parseInt(num);
  var sum = 0;
  var t = num.length;

  for (var i = 0; i < t; i++) {
    var digit = parseInt(num.charAt(i));
    sum += Math.pow(digit, t);
  }

  if (sum == originalNum) {
    alert(originalNum + " is an Armstrong number.");
  } else {
    alert(originalNum + " is not an Armstrong number.");
  }
}
Armstrong();
</script>
</body>
</html>
