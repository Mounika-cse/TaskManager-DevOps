<!DOCTYPE html>
<html>
<head>
<title>Number to Words</title>
<script>
function convertwords(num){
if(isNaN(num)||num<0||num>999){
  return"Invalid";
 }
if(num===0){
  return"zero";
}  
  const units = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"];
  const teens = ["ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
  const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
let words="";
if(num>=100){
  words+=units[Math.floor(num/100)]+" hundred ";
  num%=100;
if(num>0){
  words+="and";
}
}
if(num>=20){
  words+=tens[Math.floor(num/10)];
if(num%10>0){
  words+="-"+units[num%10];
}
}
else if(num>=10){
  words+=teens[num-10];
}
else if(num>0){
  words+=units[num];
}
return words;
}
function displaywords(){
  var Input=document.getElementById("numberInput").value;
  var number=parseInt(Input);
  var words=convertwords(number);
  document.getElementById("output").innerText="In words:"+words;
  
}
</script>
<body>
Converter
<input type="number" id="numberInput" placeholder="Enter[0-999]">
<button onclick="displaywords()">Click</button>
<p id="output"></p>
</body>
</html>
